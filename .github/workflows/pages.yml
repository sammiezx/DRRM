# Deploys the handbook to GitHub Pages.
#
# `configure-pages` with enablement:true turns Pages on using the workflow's own
# token, so the site goes live without anyone opening repo settings.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead of cancelling a live one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # Publish only what the site actually serves — not the planning documents,
      # the working notes or the git history.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html style.css app.js sw.js manifest.webmanifest icon.svg _site/
          cp .nojekyll _site/
          if [ -d img ] && [ -n "$(ls -A img)" ]; then cp -r img _site/; fi
          ls -la _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
