# Publishes the handbook to https://sammiezx.github.io/DRRM/
#
# Deploys by pushing the served files to the gh-pages branch, which is what
# Pages is configured to serve. The official configure-pages/deploy-pages route
# is not usable here: enabling a Pages site needs admin rights that the
# workflow's own GITHUB_TOKEN is not granted ("Resource not accessible by
# integration"). Pushing a branch only needs contents: write, which it has.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Never let two deploys race; queue instead of cancelling a live one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Publish only what the site serves — the planning documents, working
      # notes and git history stay in the repo but off the web.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html style.css app.js sw.js manifest.webmanifest icon.svg _site/
          cp .nojekyll _site/
          if [ -d img ] && [ -n "$(ls -A img)" ]; then cp -r img _site/; fi
          # Stamp the build into the service worker cache name, so every deploy
          # retires the previous cache instead of serving it forever.
          sed -i "s/__BUILD__/${GITHUB_SHA::7}/" _site/sw.js
          grep -n "const VERSION" _site/sw.js
          ls -la _site

      - name: Push to gh-pages
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
